<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Losowy Obrazek</title>
<style>
  :root { --bg: #111; --fg: #f2f2f2; --accent: #f2f2f2; --accent-fg: #111; color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    box-sizing: border-box;
  }
  img { max-width: 100%; max-height: calc(100dvh - 110px); object-fit: contain; border-radius: 6px; display: block; }
  button {
    font: 600 16px inherit; font-family: inherit;
    background: var(--accent); color: var(--accent-fg);
    border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
</style>
</head>
<body>
<img id="obrazek" alt="Losowy obrazek">
<button id="losuj" type="button">Losuj kolejny</button>

<script>
  // Aby dodać obrazek: wrzuć plik do folderu "obrazki" i dopisz jego nazwę poniżej.
  const OBRAZKI = [
    'obrazki/1.jpg',
    'obrazki/2.jpg',
    'obrazki/3.jpg',
    'obrazki/4.jpg',
    'obrazki/5.jpg',
    'obrazki/6.jpg',
    'obrazki/7.jpg',
    'obrazki/8.jpg',
    'obrazki/9.jpg',
    'obrazki/10.jpg',
    'obrazki/11.jpg',
    'obrazki/12.jpg',
  ];

  const img = document.getElementById('obrazek');
  const KLUCZ = 'obrazek-kolejka';

  // Telefon pamięta, których obrazków jeszcze nie pokazał.
  // Nowy obrazek jest pokazywany dopiero, gdy wszystkie były już widziane raz.
  function wczytaj(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } }
  function zapisz(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

  function potasuj(lista) {
    const a = lista.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function losuj() {
    const ostatni = wczytaj('obrazek-ostatni')[0];
    // Zostaw tylko obrazki, które nadal są na liście (gdyby jakiś usunięto).
    let kolejka = wczytaj(KLUCZ).filter(o => OBRAZKI.includes(o));
    if (kolejka.length === 0) {
      kolejka = potasuj(OBRAZKI);
      // Nowa runda nie zaczyna się od obrazka, który był przed chwilą.
      if (kolejka.length > 1 && kolejka[0] === ostatni) kolejka.push(kolejka.shift());
    }
    const obrazek = kolejka.shift();
    zapisz(KLUCZ, kolejka);
    zapisz('obrazek-ostatni', [obrazek]);
    img.src = obrazek;
  }

  document.getElementById('losuj').addEventListener('click', losuj);
  losuj();
</script>
</body>
</html>
