<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Losowy Obrazek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen — the generated picture fills the frame, a slim caption bar below */
:root {
  --bg: #eef0f4;
  --fg: #1b1e27;
  --muted: #5e6475;
  --frame: #ffffff;
  --accent: #3a4fd8;
  --accent-fg: #ffffff;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141b; --fg: #e8eaf2; --muted: #9298ab; --frame: #1c1f29;
    --accent: #8796ff; --accent-fg: #12141b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --fg: #e8eaf2; --muted: #9298ab; --frame: #1c1f29;
  --accent: #8796ff; --accent-fg: #12141b; color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--display);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.frame {
  background: var(--frame);
  padding: 12px 12px 14px;
  border-radius: 6px;
  box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 12px 40px rgb(0 0 0 / .12);
  width: min(100%, 520px, calc(100dvh - 190px));
  display: flex; flex-direction: column; gap: 10px;
}
canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 2px; max-width: 100%; }
.caption {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.caption strong { color: var(--fg); font-weight: 500; }
h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; text-align: center; }
button {
  font: 600 15px var(--display);
  background: var(--accent); color: var(--accent-fg);
  border: 0; border-radius: 999px; padding: 12px 24px; cursor: pointer;
  transition: transform .12s ease;
}
button:hover { transform: translateY(-1px); }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>

<h1>Twój losowy obrazek</h1>
<div class="frame">
  <canvas id="art" width="1024" height="1024" aria-label="Losowo wygenerowany obrazek"></canvas>
  <div class="caption"><span>styl: <strong id="style">–</strong></span><span>nr <strong id="seed">–</strong></span></div>
</div>
<button id="again" type="button">Losuj kolejny</button>

<script>
const cv = document.getElementById('art');
const ctx = cv.getContext('2d');
const W = cv.width;

function rng(seed) { // mulberry32
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function palette(r) {
  const h = r() * 360, spread = 25 + r() * 120, s = 55 + r() * 30;
  return Array.from({ length: 5 }, (_, i) =>
    `hsl(${(h + i * spread) % 360} ${s}% ${28 + ((i * 37 + r() * 30) % 52)}%)`);
}
const pick = (r, a) => a[Math.floor(r() * a.length)];

const styles = {
  'kółka'(r, p) {
    ctx.fillStyle = p[0]; ctx.fillRect(0, 0, W, W);
    for (let i = 0; i < 60; i++) {
      ctx.globalAlpha = .55 + r() * .45;
      ctx.fillStyle = pick(r, p.slice(1));
      ctx.beginPath(); ctx.arc(r() * W, r() * W, 20 + r() * 180, 0, Math.PI * 2); ctx.fill();
    }
  },
  'pasy'(r, p) {
    const n = 6 + Math.floor(r() * 14), a = r() * Math.PI;
    ctx.translate(W / 2, W / 2); ctx.rotate(a); ctx.translate(-W, -W);
    for (let i = 0; i < n; i++) { ctx.fillStyle = p[i % p.length]; ctx.fillRect(0, i * (2 * W / n), 2 * W, 2 * W / n + 1); }
  },
  'mozaika'(r, p) {
    const n = 4 + Math.floor(r() * 8), c = W / n;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      ctx.fillStyle = pick(r, p); ctx.fillRect(x * c, y * c, c + 1, c + 1);
      ctx.fillStyle = pick(r, p);
      ctx.beginPath();
      const k = Math.floor(r() * 4);
      if (k === 0) ctx.arc(x * c, y * c, c, 0, Math.PI / 2);
      else if (k === 1) { ctx.moveTo(x * c, y * c); ctx.lineTo(x * c + c, y * c); ctx.lineTo(x * c, y * c + c); }
      else if (k === 2) ctx.arc(x * c + c / 2, y * c + c / 2, c / 3, 0, Math.PI * 2);
      else ctx.rect(x * c + c / 4, y * c + c / 4, c / 2, c / 2);
      ctx.fill();
    }
  },
  'fale'(r, p) {
    ctx.fillStyle = p[0]; ctx.fillRect(0, 0, W, W);
    const n = 8 + Math.floor(r() * 10), amp = 20 + r() * 70, freq = 1 + r() * 4, ph = r() * 6;
    for (let i = n; i >= 0; i--) {
      ctx.fillStyle = p[i % p.length];
      ctx.beginPath(); ctx.moveTo(0, W);
      for (let x = 0; x <= W; x += 8)
        ctx.lineTo(x, i * W / n + Math.sin(x / W * Math.PI * 2 * freq + ph + i * .6) * amp);
      ctx.lineTo(W, W); ctx.fill();
    }
  },
  'góry'(r, p) {
    const g = ctx.createLinearGradient(0, 0, 0, W);
    g.addColorStop(0, p[4]); g.addColorStop(1, p[3]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, W);
    ctx.fillStyle = 'hsl(48 90% 88%)';
    ctx.beginPath(); ctx.arc(W * (.2 + r() * .6), W * (.15 + r() * .2), 50 + r() * 60, 0, Math.PI * 2); ctx.fill();
    for (let l = 0; l < 4; l++) {
      ctx.fillStyle = p[l]; ctx.beginPath(); ctx.moveTo(0, W);
      let y = W * (.35 + l * .15);
      for (let x = 0; x <= W; x += 16) { y += (r() - .5) * 60; y = Math.min(W, Math.max(W * .25, y)); ctx.lineTo(x, y); }
      ctx.lineTo(W, W); ctx.fill();
    }
  },
  'linie'(r, p) {
    ctx.fillStyle = p[0]; ctx.fillRect(0, 0, W, W);
    ctx.lineCap = 'round';
    for (let i = 0; i < 400; i++) {
      let x = r() * W, y = r() * W;
      ctx.strokeStyle = pick(r, p.slice(1)); ctx.lineWidth = 2 + r() * 6; ctx.globalAlpha = .7;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let s = 0; s < 40; s++) {
        const a = Math.sin(x * .004) * 2 + Math.cos(y * .004) * 2;
        x += Math.cos(a) * 8; y += Math.sin(a) * 8; ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  },
};
const names = Object.keys(styles);

function draw() {
  const seed = Math.floor(Math.random() * 1e6);
  const r = rng(seed);
  const name = pick(r, names);
  ctx.save(); ctx.globalAlpha = 1; ctx.clearRect(0, 0, W, W);
  styles[name](r, palette(r));
  ctx.restore();
  document.getElementById('style').textContent = name;
  document.getElementById('seed').textContent = String(seed).padStart(6, '0');
}
document.getElementById('again').addEventListener('click', draw);
draw();
</script>
</body>
</html>
